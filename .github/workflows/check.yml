name: Check build

on:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 && ok=1 || ok=0
          grep -E "error •|warning •" analyze.txt | head -30 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::warning::$l"; done
          [ "$ok" = 1 ]
      - run: flutter test test || true
      - name: Build web
        run: |
          flutter build web --release --no-tree-shake-icons > build.txt 2>&1 && ok=1 || ok=0
          grep -E "Error|error" build.txt | head -20 | while IFS= read -r l; do echo "::warning::$l"; done
          [ "$ok" = 1 ]
