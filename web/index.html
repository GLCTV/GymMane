<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GymHub — Lift. Log it. Grow. A free, offline gym log. Based on GymMane by InlitX.">

  <!-- iPhone: "Add to Home Screen" opens it full screen, like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymHub">
  <meta name="theme-color" content="#0A0908">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>GymHub</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0A0908; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0A0908; transition: opacity .3s ease; pointer-events: none;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .7; } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="GymHub"></div>
  <script>
    // Remove the splash once Flutter has drawn its first frame.
    function hideSplash() {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 300);
    }
    window.addEventListener('flutter-first-frame', hideSplash);
    setTimeout(hideSplash, 8000);
    // Ask the browser to keep the app's data (workouts are stored on the device).
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
